# GitHub 자동 검사 설정 (저장소의 .github/workflows/check.yml 로 복사됨)
# 코드가 올라올 때마다(모든 브랜치) 전체 검사를 돌린다 — 실패하면 GitHub 가 알림 메일을 보냄
#   (사이트 갱신(update.yml)과는 따로 돌아서, 검사가 실패해도 6시간마다 데이터 갱신은 계속됨)
name: 전체 검사

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false   # 검사 도구는 검사.py 가 따로 설치 (자동 캐시 안 씀)
      - name: 아이콘 시험용 Pillow
        run: python -m pip install -q pillow
      - name: 전체 검사
        env:
          AI_COMPARE_TOOLS: ${{ runner.temp }}/tools
          CHROME_PATH: /usr/bin/google-chrome
        run: python 소스코드/검사/검사.py
